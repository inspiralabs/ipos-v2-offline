# Sama dengan default.conf bawaan nginx:alpine, plus no-cache untuk file service worker.
# Tanpa ini Cloudflare menyimpan sw.js sampai 4 jam, jadi "Cek Update" di HP tidak melihat versi baru.
server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    location = /sw.js         { add_header Cache-Control "no-cache"; }
    location = /registerSW.js { add_header Cache-Control "no-cache"; }
}
